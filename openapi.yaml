openapi: 3.0.0
info:
  title: Order API
  version: 1.0.0
  description: Простое API для управления заказами

servers:
  - url: https://app.swaggerhub.com/apis/ssss-31a/Orders/1.0.0

paths:
  /order:
    post:
      summary: Создать новый заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Заказ успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Заказ успешно получен
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Ошибка валидации
        '409':
          description: Заказ с таким ID уже существует

  /orders:
    get:
      summary: Получить список всех заказов
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '404':
          description: Заказы не найдены

  /orders/{id}:
    get:
      summary: Получить заказ по ID
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор заказа
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Найденный заказ
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Некорректный ID
        '404':
          description: Заказ не найден

    delete:
      summary: Удалить заказ по ID
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор заказа
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Заказ успешно удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Заказ успешно удалён
        '400':
          description: Некорректный ID
        '404':
          description: Заказ не найден

    put:
      summary: Полностью обновить заказ
      parameters:
        - name: id
          in: path
          required: true
          description: ID заказа, который нужно обновить
          schema:
            type: integer
            format: uint64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Заказ успешно обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Некорректные данные
        '404':
          description: Заказ не найден

    patch:
      summary: Частично обновить заказ (ID нельзя менять)
      parameters:
        - name: id
          in: path
          required: true
          description: ID заказа
          schema:
            type: integer
            format: uint64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPatch'
      responses:
        '200':
          description: Заказ успешно обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Неверный формат или попытка изменить ID
        '404':
          description: Заказ не найден

components:
  schemas:
    Order:
      type: object
      required:
        - id
        - customer_id
        - status
        - items
        - total_amount
        - shipping_info
      properties:
        id:
          type: integer
          format: uint64
        customer_id:
          type: integer
          format: uint64
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - delivered
            - canceled
            - returned
            - failed
            - processing
            - on_hold
            - refunded
        total_amount:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shipping_info:
          $ref: '#/components/schemas/ShippingInfo'

    OrderPatch:
      type: object
      description: Частичное обновление заказа. Поле ID нельзя изменять.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - delivered
            - canceled
            - returned
            - failed
            - processing
            - on_hold
            - refunded
        total_amount:
          type: number
          format: float
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shipping_info:
          $ref: '#/components/schemas/ShippingInfo'

    OrderItem:
      type: object
      required:
        - product_id
        - quantity
        - price
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
        price:
          type: number
          format: float

    ShippingInfo:
      type: object
      required:
        - address
        - city
        - country
        - zip_code
        - contact
        - phone
      properties:
        address:
          type: string
        city:
          type: string
        country:
          type: string
        zip_code:
          type: string
        contact:
          type: string
        phone:
          type: string
